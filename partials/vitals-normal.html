<!-- Partials: Vitals Normal State -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 transition-all duration-500 ease-in-out" id="vitals-content">
  <!-- Heart Rate -->
  <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border border-emerald-100 shadow-sm relative overflow-hidden group hover:border-emerald-300 transition-all">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Detak Jantung</span>
      <span class="inline-flex items-center justify-center p-1.5 bg-rose-50 text-rose-500 rounded-lg animate-pulse">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
    </div>
    <div class="flex items-baseline space-x-2">
      <span class="text-3xl font-extrabold text-slate-800 tracking-tight" id="val-bpm">72</span>
      <span class="text-xs font-medium text-slate-500">BPM</span>
    </div>
    <div class="mt-2 flex items-center text-xs text-emerald-600 font-medium">
      <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      Irama Sinus Normal
    </div>
  </div>

  <!-- Tekanan Darah -->
  <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border border-cyan-100 shadow-sm relative overflow-hidden group hover:border-cyan-300 transition-all">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Tekanan Darah</span>
      <span class="inline-flex items-center justify-center p-1.5 bg-cyan-50 text-cyan-600 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </span>
    </div>
    <div class="flex items-baseline space-x-2">
      <span class="text-3xl font-extrabold text-slate-800 tracking-tight">118/76</span>
      <span class="text-xs font-medium text-slate-500">mmHg</span>
    </div>
    <div class="mt-2 flex items-center text-xs text-emerald-600 font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-ping"></span>
      Optimal (Normotensif)
    </div>
  </div>

  <!-- SpO2 Saturasi Oksigen -->
  <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border border-teal-100 shadow-sm relative overflow-hidden group hover:border-teal-300 transition-all">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Saturasi SpO2</span>
      <span class="inline-flex items-center justify-center p-1.5 bg-teal-50 text-teal-600 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        </svg>
      </span>
    </div>
    <div class="flex items-baseline space-x-2">
      <span class="text-3xl font-extrabold text-slate-800 tracking-tight">99%</span>
      <span class="text-xs font-medium text-slate-500">SpO2</span>
    </div>
    <div class="mt-2 flex items-center text-xs text-emerald-600 font-medium">
      <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      Oksigenasi Prima
    </div>
  </div>

  <!-- Suhu Tubuh -->
  <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border border-emerald-100 shadow-sm relative overflow-hidden group hover:border-emerald-300 transition-all">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Suhu Tubuh</span>
      <span class="inline-flex items-center justify-center p-1.5 bg-amber-50 text-amber-500 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </span>
    </div>
    <div class="flex items-baseline space-x-2">
      <span class="text-3xl font-extrabold text-slate-800 tracking-tight">36.6</span>
      <span class="text-xs font-medium text-slate-500">°C</span>
    </div>
    <div class="mt-2 flex items-center text-xs text-emerald-600 font-medium">
      <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      Suhu Afebrile (Normal)
    </div>
  </div>
</div>

<!-- Diagnostics Bar -->
<div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
  <div class="flex items-center space-x-2">
    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
    <span class="text-slate-600 font-medium">Status Keseluruhan:</span>
    <span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-semibold border border-emerald-200">
      Kondisi Prima & Stabil
    </span>
  </div>
  <div class="text-slate-400 font-mono">
    Sinkronisasi Terakhir: <span class="text-slate-600 font-medium sync-time">Baru saja</span>
  </div>
</div>
